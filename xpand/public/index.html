<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Xpand API</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        line-height: 1.6;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        opacity: 0.7;
        font-size: 0.9375rem;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.875em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Xpand API</h1>
      <p>
        This host serves the API, not the app. Endpoints live under <code>/api</code> and require a
        Telegram Mini App signature. Open the Mini App from the bot instead.
      </p>
    </main>
  </body>
</html>
